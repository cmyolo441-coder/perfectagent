name: build-binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q fullagent
      - name: Run every module self-test
        run: |
          fail=0
          for m in attention autopilot bandit brain cassette causal ci compiler \
                   cortex council cov crew daemon dashboard debate dual evolution \
                   fabric forge formal fuzz goal healer homeo judge kernel kgraph \
                   market mastermind mcts memory merge mesh meta mutate nexus \
                   oracle race report router semantic skills snapshots speculate \
                   synth systemprompt taint team theater tower tuner world workflows; do
            if ! python -m fullagent.$m >/dev/null 2>&1; then
              echo "SELF-TEST FAILED: $m"
              fail=1
            fi
          done
          exit $fail

  build:
    needs: selftest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: fullagent-linux-x64
          - os: windows-latest
            asset: fullagent-windows-x64.exe
          - os: macos-latest
            asset: fullagent-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build single-file binary
        run: pyinstaller --clean --noconfirm fullagent.spec
      - name: Verify binary
        shell: bash
        run: |
          cd dist
          BIN="fullagent"
          if [[ "${{ matrix.os }}" == windows-* ]]; then BIN="fullagent.exe"; fi
          ./$BIN --version
      - name: Rename asset
        shell: bash
        run: |
          cd dist
          SRC="fullagent"
          if [[ "${{ matrix.os }}" == windows-* ]]; then SRC="fullagent.exe"; fi
          mv "$SRC" ../${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage assets
        run: |
          mkdir -p release_assets
          for d in artifacts/*/; do mv "$d"* release_assets/ 2>/dev/null || true; done
          chmod +x release_assets/* 2>/dev/null || true
          ls -la release_assets/
      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          Single-file binaries — fullagent works out of the box, no Python needed.

          | Platform | How to install |
          |---|---|
          | Linux x64 | `curl -fsSL https://raw.githubusercontent.com/cmyolo441-coder/perfectagent/main/install.sh \| bash` |
          | Windows x64 | download `fullagent-windows-x64.exe`, rename to `fullagent.exe`, put on PATH |
          | macOS (Apple Silicon) | download `fullagent-darwin-arm64`, `chmod +x`, move to /usr/local/bin |
          | Termux (Android) | `curl -fsSL https://raw.githubusercontent.com/cmyolo441-coder/perfectagent/main/install-termux.sh \| bash` |
          | Any OS with Python 3.9+ | `pip install git+https://github.com/cmyolo441-coder/perfectagent.git` |
          EOF
          sed -i 's/^          //' notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: *** secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          gh release view "$VERSION" >/dev/null 2>&1 && gh release delete "$VERSION" --yes || true
          gh release create "$VERSION" release_assets/* \
            --title "FullAgent ${VERSION}" \
            --notes-file notes.md
